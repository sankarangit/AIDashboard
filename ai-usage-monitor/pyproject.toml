[project]
name = "ai-usage-monitor"
version = "0.1.0"
description = "Local monitor for authorized AI provider usage, cost, and subscription records."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "streamlit>=1.40",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "apscheduler>=3.10",
    "plotly>=5.24",
    "pandas>=2.2",
    "python-multipart>=0.0.18",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]
pg = [
    "psycopg[binary]>=3.2",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --basetemp=data/pytest-tmp"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["backend", "tests", "scripts"]
extend-exclude = [".venv", "data", "migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
